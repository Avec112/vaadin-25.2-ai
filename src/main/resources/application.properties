server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,io.github.avec112

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update

# Artificial Intelligence
# API KEY
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.model=gpt-5
spring.ai.ollama.base-url=http://localhost:11434
# Valid values are whatever "ollama list" prints (name + tag); the string is
# passed verbatim to Ollama. Defaults to mistral when unset.
# The model MUST support tool calling, because AIOrchestrator always registers
# a built-in get_session_context tool.
# Check with: ollama show <model>   -> Capabilities must list "tools"
# NOTE: deepseek-r1 has no tool support and fails here with 400 Bad Request.
spring.ai.ollama.chat.model=qwen3
#spring.ai.ollama.chat.model=mistral
#spring.ai.ollama.chat.model=llama3.1:8b
