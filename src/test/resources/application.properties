# This file REPLACES src/main/resources/application.properties during tests rather than merging
# with it: Spring Boot loads only the first "application.properties" it finds on the classpath, and
# target/test-classes precedes target/classes there. Anything a test needs from the main file (chat
# model, embedding model, base-url, ...) must be repeated here explicitly, or it is silently unset.
#
# Tests must never contact Ollama. Ingestion is the only startup path that would,
# and the pull strategy is the other. Both are off here.
app.rag.ingest-on-startup=false
spring.ai.ollama.init.pull-model-strategy=never
# Nothing listens here: any accidental call fails fast instead of silently succeeding
# on a developer machine that happens to be running Ollama.
spring.ai.ollama.base-url=http://127.0.0.1:1
